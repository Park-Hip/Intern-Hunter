llm:
  primary_provider: "gemini"
  fallback_provider: "groq"
  validation_model: "gemini-2.5-flash-lite"
  
  gemini:
    model: "gemini-2.5-flash-lite"
    temperature: 0.1
    max_tokens: 2048
    
  groq:
    model: "llama-3.3-70b-versatile"
    temperature: 0.0
    max_tokens: 1024

agent:
  max_iterations: 5
  memory_limit: 10
  default_query_limit: 50
  max_query_limit: 100

crawler:
  rate_limit_rpm: 6
  max_retries: 2
  max_pages: 5
  extract_delay_min: 10.0
  extract_delay_max: 15.0
  topcv:
    search_seeds:
      - name: ai_engineer
        url: "https://www.topcv.vn/tim-viec-lam-ai-engineer?sba=1"
      - name: data_scientist
        url: "https://www.topcv.vn/tim-viec-lam-data-scientist?sba=1"
    headless: false
    enable_stealth: true
    user_agent_mode: "random"
    use_persistent_context: false
    user_data_dir: null
    storage_state_path: null
    page_timeout_ms: 60000
    delay_before_return_html: 5.0
    fetch_wait_for: "css:.job-item-search-result"
    wait_for: "css:h1, h2.title, .job-detail-title"
    screenshot: false
    cache_mode: "bypass"
    magic: true
    simulate_user: true
    remove_overlay_elements: false
    exclude_external_links: true
    word_count_threshold: 5
    proxy_enabled: false
    proxy_servers:
      - "dc.oxylabs.io:8001"
      - "dc.oxylabs.io:8002"
      - "dc.oxylabs.io:8003"
      - "dc.oxylabs.io:8004"
      - "dc.oxylabs.io:8005"
    proxy_rotation: "round_robin" 
    proxy_username_env: "OXYLABS_USERNAME"
    proxy_password_env: "OXYLABS_PASSWORD"
    detail_delay_min_seconds: 15.0
    detail_delay_max_seconds: 30.0
    blocked_delay_min_seconds: 30.0
    blocked_delay_max_seconds: 60.0
    blocked_early_stop_threshold: 1
    blocked_cooldown_minutes: 180

logging:
  format: "console"
  level: "INFO"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment: "job-finder"
